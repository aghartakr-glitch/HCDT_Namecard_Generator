<title>명함 생성기</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 좌측 입력 패널 + 우측 앞/뒷면 미리보기, 하단에 시안 선택. 카드는 실제 비율(90×50mm) 유지 */
:root{
  --bg:#f3f2f6; --panel:#ffffff; --fg:#17151c; --muted:#6a6675; --line:#dedce6;
  --accent:#6b00ff; --accent-fg:#ffffff; --accent-soft:#ece3ff; --stage:#e6e4ec; --warn:#a8460a; --warn-bg:#fff0e3;
  --font-ui:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121016; --panel:#1b1821; --fg:#eeecf3; --muted:#9a96a7; --line:#322e3b;
  --accent:#9a66ff; --accent-fg:#120a24; --accent-soft:#2a1f45; --stage:#0c0b10; --warn:#ffb27a; --warn-bg:#35210f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121016; --panel:#1b1821; --fg:#eeecf3; --muted:#9a96a7; --line:#322e3b;
  --accent:#9a66ff; --accent-fg:#120a24; --accent-soft:#2a1f45; --stage:#0c0b10; --warn:#ffb27a; --warn-bg:#35210f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.55;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;border-bottom:2px solid var(--fg);padding-bottom:12px}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:13px}
header .lang{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-left:12px}
header .lang button{border:0;border-radius:0;padding:5px 12px;font-family:var(--font-mono);font-size:12px;background:var(--panel);color:var(--muted)}
header .lang button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);font-weight:700}
header .tools{margin-left:auto;display:flex;align-items:center}
header .spec{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
main{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}}
section.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:12px;min-width:0}
h2{font-size:12px;margin:0;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
input[type=text],input[type=email]{font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;min-width:0}
input[type=text]:focus-visible,input[type=email]:focus-visible,button:focus-visible,.pick:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:56px minmax(0,1fr);gap:8px;align-items:end}
.fld{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center}
.fld b{font-family:var(--font-mono);font-size:13px;text-align:center;color:var(--accent)}
.fld .lab{width:100%;text-align:center;padding:8px 2px;font-family:var(--font-mono);font-weight:500}
button{font:inherit;font-size:13px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.stage{background:var(--stage);border-radius:6px;padding:20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:640px){.stage{grid-template-columns:minmax(0,1fr);padding:14px}}
.side{display:grid;gap:8px;min-width:0}
.side .cap{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;font-family:var(--font-mono)}
.card{box-shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.18);background:#fff;line-height:0;max-width:100%}
.card svg{display:block;width:100%;height:auto}
.picks{display:grid;gap:10px}
.picks .grp{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:center}
.picks .grp>span{font-size:12px;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.pick{padding:0;border:2px solid var(--line);background:#fff;line-height:0;border-radius:3px;cursor:pointer}
.pick[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pick svg{display:block;width:100%;height:auto}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:8px 10px;font-size:12.5px;display:grid;gap:2px}
.warn[hidden]{display:none}
.note{font-size:12px;color:var(--muted);margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--font-mono);font-size:11.5px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.drop{border:1px dashed var(--line);border-radius:4px;padding:12px;text-align:center;font-size:12.5px;color:var(--muted)}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
details summary{cursor:pointer;font-size:13px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:4px;font-size:13px;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
table{border-collapse:collapse;font-size:12.5px;width:100%}
td,th{border-top:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.tw{overflow-x:auto}

.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{width:34px;height:34px;border-radius:50%;padding:0;background:var(--c);border:1px solid var(--line);box-shadow:inset 0 0 0 2px var(--panel);cursor:pointer}
.sw[aria-checked=true]{outline:2px solid var(--fg);outline-offset:2px}
.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cname{font-family:var(--font-mono);font-size:12px;color:var(--muted);margin:6px 0 0}

.tsel{display:grid;gap:6px;font-size:12px;color:var(--muted)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tc{display:grid;gap:0;text-align:left;padding:6px 10px;line-height:1.25;border-radius:4px}
.tc b{font-weight:500;font-size:13px;color:var(--fg)}
.tc small{font-size:11px;color:var(--muted)}
.tc[aria-checked=true]{background:var(--accent);border-color:var(--accent)}
.tc[aria-checked=true] b,.tc[aria-checked=true] small{color:var(--accent-fg)}
</style>

<div class="wrap">
  <header>
    <h1 data-i="h1"></h1>
    <p data-i="sub"></p>
    <div class="tools"><span class="spec">90 × 50 mm</span>
      <div class="lang" role="group" aria-label="Language / 언어"><button type="button" id="lko" lang="ko">한</button><button type="button" id="len" lang="en">EN</button></div>
    </div>
  </header>

  <main>
    <div style="display:grid;gap:20px;min-width:0">
      <section class="panel" aria-labelledby="h-info">
        <h2 id="h-info" data-i="hInfo"></h2>
        <label><span data-i="lName"></span><input type="text" id="name" autocomplete="off"></label>
        <div class="tsel"><span class="lbl" data-i="lTitle"></span><div class="tchips" id="tchips" role="radiogroup" aria-label="Title"></div><input type="text" id="title" data-ip="lTitle" autocomplete="off" hidden></div>
        <div class="fld"><b>E</b><input type="text" id="email" data-ia="email" data-ip="email" autocomplete="off"></div>
        <div class="fld"><b>O</b><input type="text" id="office" data-ia="office" data-ip="office" autocomplete="off"></div>
        <div class="fld"><b>P</b><input type="text" id="mobile" data-ia="mobile" data-ip="mobile" autocomplete="off"></div>
        <div class="fld"><b>W</b><input type="text" id="web" data-ia="web" data-ip="web" autocomplete="off"></div>
        <div class="fld"><input type="text" id="xlab" class="lab" maxlength="2" data-ia="xlab" placeholder="A"><input type="text" id="xval" data-ia="xval" data-ip="xval" autocomplete="off"></div>
        <p class="note" data-i="noteRows"></p>
        <div class="btns"><button type="button" id="clear" data-i="clear"></button><button type="button" id="sample" data-i="sample"></button></div>
      </section>

      <section class="panel" aria-labelledby="h-exp">
        <h2 id="h-exp" data-i="hExp"></h2>
        <div class="btns">
          <button type="button" class="primary" id="exPdf" data-i="exPdf"></button>
          <button type="button" id="exSvgF" data-i="exSvgF"></button>
          <button type="button" id="exSvgB" data-i="exSvgB"></button>
        </div>
        <div class="warn" id="exwarn" hidden></div>
        <p class="note" data-i="exNote"></p>
      </section>
    </div>

    <div style="display:grid;gap:20px;min-width:0">
      <section class="stage" aria-label="Preview">
        <div class="side"><div class="cap"><span data-i="front"></span><span id="capF"></span></div><div class="card" id="prevF"></div></div>
        <div class="side"><div class="cap"><span data-i="back"></span><span id="capB"></span></div><div class="card" id="prevB"></div></div>
      </section>
      <div class="warn" id="warn" hidden></div>
      <section class="panel" aria-labelledby="h-pick">
        <h2 id="h-pick" data-i="hPick"></h2>
        <div class="picks">
          <div class="grp"><span data-i="color"></span><div><div class="swatches" id="swatches" role="radiogroup" aria-label="Color"></div><p class="cname" id="cname"></p></div></div>
          <div class="grp"><span data-i="front"></span><div class="thumbs" id="thF"></div></div>
          <div class="grp"><span data-i="back"></span><div class="thumbs" id="thB"></div></div>
        </div>
        <p class="note" data-i="pickNote"></p>
      </section>
      <section class="panel" aria-labelledby="h-spec">
        <h2 id="h-spec" data-i="hSpec"></h2>
        <div class="tw"><table>
          <tr><th data-i="thItem"></th><th data-i="thVal"></th></tr>
          <tr><td data-i="sSize"></td><td>312.3 × 173.6 = 90 × 50 mm (1.80)</td></tr>
          <tr><td data-i="sColor"></td><td data-i="sColorV"></td></tr>
          <tr><td data-i="sName"></td><td>Helvetica Neue LT Std Bold, 20.82</td></tr>
          <tr><td data-i="sBody"></td><td data-i="sBodyV"></td></tr>
        </table></div>
      </section>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

    let cx=x,d='';
    for(const r of runs(str,bold)){
      if(!r.f){cx+=size*0.55*r.t.length;continue}
      d+=r.f.getPath(r.t,cx,y,size).toPathData(2);cx+=r.f.getAdvanceWidth(r.t,size);
    }
    return `<path d="${d}" fill="${fill}"/>`;
  }
  return `<text x="${x}" y="${y}" font-family="${STACK}" font-size="${size}" font-weight="${bold?700:400}" fill="${fill}">${esc(str)}</text>`;
}
function data(){const o={};IDS.forEach(i=>o[i]=$(i).value.trim());return o}

function frontSVG(i,uid,c){
  const f=A.fronts[i],L=A.logo,T=TH[c|0],M=T.main,base=!(c|0);
  let p=PUR,d=DK,n=NV,sl='';
  if(f.white){ if(base){p=d=n='#fff'}else{p=d=n=PUR;sl=`<path d="${L.S}" fill="#5960D8"/>`} }
  else if(!base){sl=`<path d="${L.S}" fill="${M}"/>`}
  return `<g clip-path="url(#${uid})">`+
    (f.bg?`<rect width="${W}" height="${H}" fill="${M}"/>`:'')+
    (f.deco?`<path d="${f.deco}" fill="${M}"/>`:'')+
    `<g transform="translate(${f.logo[0]} ${f.logo[1]})"><path d="${L.P}" fill="${p}"/>${sl}<path d="${L.D}" fill="${d}"/><path d="${L.N}" fill="${n}"/></g></g>`;
}
function backSVG(i,uid,D,warns,c){
  const b=A.backs[i];
  let s=`<g clip-path="url(#${uid})">`+(b.deco?`<path d="${b.deco}" fill="${TH[c|0].main}"/>`:'');
  const avail=b.limit-b.name[0];
  let size=20.82,w=width(D.name,size,true);
  if(w>avail){size=Math.max(12,size*avail/w);w=width(D.name,size,true);if(w>avail&&warns)warns.push(t('wName'))}
  s+=text(D.name,b.name[0],b.name[1],+size.toFixed(2),true,'#000');
  s+=text(D.title,b.title[0],b.title[1],7.92,false,'#000');
  const rows=[['E',D.email],['O',D.office],['P',D.mobile],['W',D.web],[D.xlab||'·',D.xval]].filter(r=>r[1]);
  rows.forEach((r,k)=>{
    const y=+(b.last-(rows.length-1-k)*b.step).toFixed(2);
    s+=text(r[0],b.lab,y,7.92,true,'#000')+text(r[1],b.val,y,7.92,false,'#000');
    if(warns&&b.val+width(r[1],7.92,false)>b.limit)warns.push(t('wRow',r[1]));
  });
  if(warns&&rows.length){const top=b.last-(rows.length-1)*b.step;if(top<b.title[1]+11)warns.push(t('wMany'))}
  return s+'</g>';
}
let uidN=0;
function wrap(inner,uid,extra=''){
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" ${extra}><defs><clipPath id="${uid}"><rect width="${W}" height="${H}"/></clipPath></defs><rect width="${W}" height="${H}" fill="#fff"/>${inner}</svg>`;
}
function svgFront(i,extra,c){const u='cf'+(uidN++);return wrap(frontSVG(i,u,c),u,extra||'')}
function svgBack(i,D,warns,extra,c){const u='cb'+(uidN++);return wrap(backSVG(i,u,D,warns,c),u,extra||'')}

function render(){
  const D=data(),warns=[];if(HAN.test(Object.values(D).join('')))warns.push(t('wKr'));
  $('prevF').innerHTML=svgFront(st.f,'',st.c);
  $('prevB').innerHTML=svgBack(st.b,D,warns,'',st.c);
  $('capF').textContent=t('F')[st.f];$('capB').textContent=t('B')[st.b];
  [...$('thF').children].forEach((el,i)=>{el.setAttribute('aria-pressed',i===st.f);el.title=t('F')[i];el.setAttribute('aria-label',t('fF')+t('F')[i]);el.innerHTML=svgFront(i,'',st.c)});
  [...$('thB').children].forEach((el,i)=>{el.setAttribute('aria-pressed',i===st.b);el.title=t('B')[i];el.setAttribute('aria-label',t('fB')+t('B')[i]);el.innerHTML=svgBack(i,D,null,'',st.c)});
  const w=$('warn');w.hidden=!warns.length;w.innerHTML=[...new Set(warns)].map(x=>`<span>${esc(x)}</span>`).join('');
  [...$('swatches').children].forEach((el,k)=>{el.setAttribute('aria-checked',k===st.c);el.title=t('C')[k]+' '+TH[k].main;el.setAttribute('aria-label',t('C')[k]+' '+TH[k].main)});
  $('cname').textContent=t('C')[st.c]+' · '+TH[st.c].main;
  syncTitle();
  exportState();
  try{localStorage.setItem('namecard-v1',JSON.stringify({D,st}))}catch(e){}
}
const TITLES=[['Full Professor','교수'],['Associate Professor','부교수'],['Assistant Professor','조교수'],['Postdoctoral Researcher','포닥'],['Ph.D. Student','박사과정'],['M.S. Student','석사과정'],['Undergraduate Student','학부생']];
let customT=false;
function buildTitles(){
  const box=$('tchips');
  [...TITLES,['','custom']].forEach((T,i)=>{
    const b=document.createElement('button');b.type='button';b.className='tc';b.setAttribute('role','radio');
    b.innerHTML='<b></b><small></small>';
    b.onclick=()=>{
      if(i===TITLES.length){customT=!customT;if(customT){$('title').value='';$('title').hidden=false;$('title').focus()}}
      else{customT=false;$('title').value=($('title').value.trim()===T[0])?'':T[0]}
      render();
    };
    box.appendChild(b);
  });
}
function syncTitle(){
  const v=$('title').value.trim(),idx=TITLES.findIndex(x=>x[0]===v);
  if(idx<0&&v)customT=true;
  [...$('tchips').children].forEach((el,i)=>{
    const last=i===TITLES.length;
    el.setAttribute('aria-checked',last?customT:(!customT&&i===idx));
    el.firstChild.textContent=last?t('tCustom'):TITLES[i][0];
    el.lastChild.textContent=last?'':(LANG==='ko'?TITLES[i][1]:'');
    el.lastChild.hidden=last||LANG!=='ko';
  });
  $('title').hidden=!customT;
}
function buildSwatches(){
  const box=$('swatches');
  TH.forEach((T,k)=>{
    const b=document.createElement('button');b.type='button';b.className='sw';b.setAttribute('role','radio');b.dataset.k=k;
    b.style.setProperty('--c',T.main);b.onclick=()=>{st.c=k;render()};box.appendChild(b);
  });
}
function relang(){applyLang();chips();render()}
function buildThumbs(){
  const tf=$('thF'),tb=$('thB');
  for(let i=0;i<5;i++){
    let b=document.createElement('button');b.type='button';b.className='pick';b.innerHTML=svgFront(i,'',st.c);
    b.onclick=()=>{st.f=i;render()};tf.appendChild(b);
    b=document.createElement('button');b.type='button';b.className='pick';
    b.onclick=()=>{st.b=i;render()};tb.appendChild(b);
  }
}

/* 글꼴 */
async function loadFonts(files){
  for(const file of files){
    try{
      const buf=await file.arrayBuffer();const f=opentype.parse(buf);
      const kr=f.charToGlyphIndex('한')>0;
      const w=f.tables.os2?f.tables.os2.usWeightClass:400;
      const bold=w>=600;
      const key=(kr?'kr':'la')+(bold?'B':'R');
      fonts[key]=f;fonts.names[key]=file.name;
    }catch(e){toast(t('tFont',file.name))}
  }
  chips();render();
}
function chips(){}
function exportState(){
  const han=HAN.test(Object.values(data()).join(''));
  const w=$('exwarn');w.hidden=true;w.innerHTML='';
  ['exPdf','exSvgF','exSvgB'].forEach(k=>$(k).disabled=han);
}
/* 내보내기 */
let tt;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200)}
async function saveFile(name,blob){
  try{
    const dl=window.claude&&await claude.use('downloads');
    if(dl){await dl.save({filename:name,data:blob});toast(t('tSaved',name));return}
  }catch(e){if(e&&e.code==='declined')return;if(e&&e.code&&e.code!=='unavailable'&&e.code!=='not_granted'){toast(t('tFail',e.code));return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast(t('tSaved',name));
}
function fname(side){const n=($('name').value.trim()||'namecard').replace(/[^\p{L}\p{N}_-]+/gu,'_');return `NFUD_namecard_${n}_${side}`}
function exSvg(side){
  const D=data();
  const ex=`width="90mm" height="50mm"`;
  const s=side==='front'?svgFront(st.f,ex,st.c):svgBack(st.b,D,null,ex,st.c);
  saveFile(fname(side)+'.svg',new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+s],{type:'image/svg+xml'}));
}
async function exPdf(){
  if(!window.jspdf){toast(t('tLib'));return}
  const btn=$('exPdf');btn.disabled=true;
  try{
    const D=data();
    const doc=new jspdf.jsPDF({unit:'mm',format:[90,50],orientation:'landscape',compress:true});
    const host=document.createElement('div');host.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(host);
    for(const [k,side] of [[0,'f'],[1,'b']]){
      host.innerHTML=side==='f'?svgFront(st.f,`width="${W}" height="${H}"`,st.c):svgBack(st.b,D,null,`width="${W}" height="${H}"`,st.c);
      if(!outlined())host.querySelectorAll('text').forEach(t=>t.setAttribute('font-family','Helvetica'));
      if(k)doc.addPage([90,50],'landscape');
      await doc.svg(host.firstElementChild,{x:0,y:0,width:90,height:50});
    }
    host.remove();
    await saveFile(fname('card')+'.pdf',doc.output('blob'));
  }catch(e){console.error(e);toast(t('tPdf',e.message||e))}
  finally{btn.disabled=false;exportState()}
}

/* 초기화 */
function setData(o){customT=false;IDS.forEach(i=>$(i).value=o[i]||'')}
function init(){
  let saved=null;try{saved=JSON.parse(localStorage.getItem('namecard-v1')||'null')}catch(e){}
  setData(saved&&saved.D?saved.D:SAMPLE);
  if(saved&&saved.st){st.f=saved.st.f|0;st.b=saved.st.b|0;st.c=Math.min(Math.max(saved.st.c|0,0),TH.length-1)}
  try{const l=localStorage.getItem('namecard-lang');LANG=l||((navigator.language||'ko').startsWith('ko')?'ko':'en')}catch(e){}
  try{fonts.laR=opentype.parse(b64buf(FONT_B64.R));fonts.laB=opentype.parse(b64buf(FONT_B64.B))}catch(e){console.error(e)}
  buildSwatches();buildTitles();buildThumbs();applyLang();chips();render();
  $('lko').onclick=()=>{LANG='ko';relang()};$('len').onclick=()=>{LANG='en';relang()};
  IDS.forEach(i=>$(i).addEventListener('input',render));
  $('clear').onclick=()=>{setData({});render();$('name').focus()};
  $('sample').onclick=()=>{setData(SAMPLE);render()};
  $('exPdf').onclick=exPdf;$('exSvgF').onclick=()=>exSvg('front');$('exSvgB').onclick=()=>exSvg('back');
}
init();
</script>
