<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>

<title>HCDT Name Card</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* 레이아웃: 좌측 입력 패널 + 우측 앞/뒷면 미리보기, 하단에 시안·색상 선택. 카드는 실제 비율(90×50mm) 유지 */
:root{
  --bg:#ffffff; --panel:#ffffff; --fg:#17151c; --muted:#6b6b6b; --line:#e2e2e2;
  --accent:#6b00ff; --accent-fg:#ffffff; --accent-soft:#ece3ff; --stage:#ffffff; --warn:#a8460a; --warn-bg:#fff0e3;
  --font-ui:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121016; --panel:#1b1821; --fg:#eeecf3; --muted:#9a96a7; --line:#322e3b;
  --accent:#9a66ff; --accent-fg:#120a24; --accent-soft:#2a1f45; --stage:#0c0b10; --warn:#ffb27a; --warn-bg:#35210f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121016; --panel:#1b1821; --fg:#eeecf3; --muted:#9a96a7; --line:#322e3b;
  --accent:#9a66ff; --accent-fg:#120a24; --accent-soft:#2a1f45; --stage:#0c0b10; --warn:#ffb27a; --warn-bg:#35210f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:var(--fs-small);line-height:1.55;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;border-bottom:1px solid var(--line);padding-bottom:12px}
h1{font-size:var(--fs-h4);margin:0;font-weight:700;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:var(--fs-small)}
header .lang{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-left:12px}
header .lang button{border:0;border-radius:0;padding:5px 12px;font-family:var(--font-mono);font-size:var(--fs-small);background:var(--panel);color:var(--muted)}
header .lang button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);font-weight:700}
header .tools{margin-left:auto;display:flex;align-items:center}
header .spec{font-family:var(--font-mono);font-size:var(--fs-small);color:var(--muted)}
main{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}}
section.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:12px;min-width:0}
h2{font-size:var(--fs-small);margin:0;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
label{display:grid;gap:4px;font-size:var(--fs-small);color:var(--muted)}
input[type=text]{font:inherit;font-size:var(--fs-small);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;min-width:0}
input[type=text]:focus-visible,button:focus-visible,.pick:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.fld{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center}
.fld b{font-family:var(--font-mono);font-size:var(--fs-small);text-align:center;color:var(--accent)}
.fld .lab{width:100%;text-align:center;padding:8px 2px;font-family:var(--font-mono);font-weight:500}
button{font:inherit;font-size:var(--fs-small);border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.stage{background:var(--stage);border-radius:6px;padding:20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:640px){.stage{grid-template-columns:minmax(0,1fr);padding:14px}}
.side{display:grid;gap:8px;min-width:0}
.side .cap{font-size:var(--fs-small);color:var(--muted);display:flex;justify-content:space-between;font-family:var(--font-mono)}
.card{box-shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.18);background:#fff;line-height:0;max-width:100%}
.card svg{display:block;width:100%;height:auto}
.picks{display:grid;gap:18px}
.pk{display:grid;gap:10px}
.pk>h3{margin:0;font-size:var(--fs-small);font-weight:700}
.sub{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center}
.sub[hidden],.vt[hidden]{display:none}
.sub>span{font-size:var(--fs-small);color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:480px){.thumbs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pick{padding:0;border:2px solid var(--line);background:#fff;line-height:0;border-radius:3px;cursor:pointer;position:relative}
.pick[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pick svg{display:block;width:100%;height:auto}
.pick i{position:absolute;left:2px;top:2px;font:500 var(--fs-small)/1 var(--font-mono);font-style:normal;color:#fff;background:rgba(23,21,28,.7);padding:2px 3px;border-radius:2px}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:8px 10px;font-size:var(--fs-small);display:grid;gap:2px}
.warn[hidden]{display:none}
.note{font-size:var(--fs-small);color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:4px;font-size:var(--fs-small);max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
table{border-collapse:collapse;font-size:var(--fs-small);width:100%}
td,th{border-top:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.tw{overflow-x:auto}
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;padding:0;background:var(--c);border:1px solid var(--line);box-shadow:inset 0 0 0 2px var(--panel);cursor:pointer}
.sw.wh{background:#fff}
.sw[aria-checked=true]{outline:2px solid var(--fg);outline-offset:2px}
.cname{font-family:var(--font-mono);font-size:var(--fs-small);color:var(--muted);margin:0}
.tsel{display:grid;gap:6px;font-size:var(--fs-small);color:var(--muted)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tc{display:grid;gap:0;text-align:left;padding:6px 10px;line-height:1.25;border-radius:4px}
.tc b{font-weight:500;font-size:var(--fs-small);color:var(--fg)}
.tc small{font-size:var(--fs-small);color:var(--muted)}
.tc[aria-checked=true]{background:var(--accent);border-color:var(--accent)}
.tc[aria-checked=true] b,.tc[aria-checked=true] small{color:var(--accent-fg)}
.cnb{display:flex;flex-wrap:wrap;gap:6px}
.cb{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:4px}
.cb svg{width:16px;height:16px;fill:currentColor}
.cb[aria-checked=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-small);color:var(--muted)}
.chk input{accent-color:var(--accent)}
.gap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.gap input{width:100%;accent-color:var(--accent)}
.gap output{font-family:var(--font-mono);font-size:var(--fs-small);color:var(--muted);min-width:7.5em;text-align:right}
.vtabs{display:flex;gap:6px;flex-wrap:wrap}
.vt{display:grid;gap:0;text-align:left;padding:6px 10px;line-height:1.25;border-radius:4px}
.vt b{font-weight:700;font-size:var(--fs-small)}
.vt small{font-size:var(--fs-small);color:var(--muted)}
.vt[aria-checked=true]{background:var(--accent);border-color:var(--accent)}
.vt[aria-checked=true] b,.vt[aria-checked=true] small{color:var(--accent-fg)}
.ovr{display:grid;gap:12px}
.og{display:grid;gap:6px}
.og>span{font-size:var(--fs-small);color:var(--fg);font-weight:500}
.og>span small{font-weight:400;color:var(--muted);margin-left:6px;font-size:var(--fs-small)}
select{font:inherit;font-size:var(--fs-small);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%}
.sw.k{background:#000}
.og .sw:not(.def){width:24px;height:24px}
.og .swatches{gap:8px;flex-wrap:nowrap}
.sw.def{width:auto;border-radius:4px;padding:0 10px;height:30px;font-size:var(--fs-small);background:var(--panel);color:var(--fg)}
.sw.def[aria-checked=true]{outline:2px solid var(--fg);outline-offset:2px}
.thumbs{grid-template-columns:repeat(5,minmax(0,1fr))}

main{grid-template-columns:minmax(0,5fr) minmax(0,6fr)!important;gap:24px!important}
.left{display:grid;gap:16px;align-content:start;min-width:0}
@media (min-width:861px) and (min-height:860px){.left{position:sticky;top:16px}}
.right{display:grid;gap:16px;align-content:start;min-width:0}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)!important}}
.stage{grid-template-columns:minmax(0,1fr)!important;gap:18px!important;padding:18px!important}
.left .exp{padding:14px}
h2{display:flex;align-items:center;gap:10px;font-size:var(--fs-small);letter-spacing:.04em;text-transform:none;color:var(--fg)}
h2 .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-fg);font:700 var(--fs-small)/1 var(--font-mono)}
.sh{margin:0;font-size:var(--fs-small);font-weight:700}
.hr{border-top:1px solid var(--line)}
.pk>h3{font-size:var(--fs-small);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.picks{grid-template-columns:minmax(0,1fr);gap:20px}
.sub{grid-template-columns:48px minmax(0,1fr)!important}
details.spec summary{cursor:pointer;font-size:var(--fs-small);font-weight:700;letter-spacing:.04em;color:var(--muted)}
details.spec[open] summary{margin-bottom:10px}
.sw{width:28px;height:28px}

main{display:grid!important;grid-template-columns:minmax(0,1fr)!important;gap:20px!important}
.zone{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:clip}
.zone.one{grid-template-columns:minmax(0,1fr)}
.zone>.zh{grid-column:1/-1;display:flex;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
.zone h2{font-size:var(--fs-small);letter-spacing:0;margin:0}
.tag{display:inline-block;padding:3px 12px;border-radius:999px;font-size:var(--fs-small);font-weight:700}
.tag.f{background:var(--accent);color:var(--accent-fg)}
.tag.b{background:var(--fg);color:var(--bg)}
.zc{padding:16px 18px;display:grid;gap:10px}
.zl{padding:18px;background:var(--stage);border-right:1px solid var(--line)}
.zl .pv{display:grid;gap:12px;position:sticky;top:16px}
.zr{padding:18px;display:grid;gap:22px;align-content:start;min-width:0}
.blk{display:grid;gap:12px;min-width:0}
.blk+.blk{border-top:1px solid var(--line);padding-top:20px}
.zr .sub{grid-template-columns:64px minmax(0,1fr)}
@media (max-width:860px){.zone{grid-template-columns:minmax(0,1fr)}.zl{border-right:0;border-bottom:1px solid var(--line)}.zl .pv{position:static}}
.vt small,.og>span small{display:none}
.vt{padding-top:8px;padding-bottom:8px}


.og{grid-template-columns:132px minmax(0,1fr);align-items:center;gap:8px}
.og>span{white-space:nowrap}
.ovr{gap:10px!important}
.og .sw:not(.def){width:26px;height:26px}
.og.crow .cb{padding:5px 9px;font-size:var(--fs-small)}
.og .gap{display:flex;align-items:center;gap:10px;margin:0}
.og .gap input{flex:1;min-width:120px}
.blk .hr{display:none}

.ovwrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:0 22px;align-items:start}
.ovwrap .og{grid-template-columns:auto auto;justify-content:start;gap:14px}
.ovwrap .og>span{width:132px}
.cncol{display:grid;gap:12px;border-left:1px solid var(--line);padding-left:22px;align-content:start;min-width:0}
.cncol .cnh{font-size:var(--fs-small);font-weight:700}
.cncol .cnb{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.cncol .cb{justify-content:flex-start;padding:6px 10px;font-size:var(--fs-small)}
.cncol .gap{grid-template-columns:minmax(0,1fr);gap:4px}
.cncol .gap output{text-align:left}
@media (max-width:560px){.ovwrap{grid-template-columns:minmax(0,1fr)}.cncol{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:14px;margin-top:10px}}
#thB .pick i{left:auto;right:2px}
#thF[data-v="2"] .pick,#thF[data-v="5"] .pick{overflow:hidden}
#thF[data-v="2"] .pick svg,#thF[data-v="5"] .pick svg{transform:scale(1.5);transform-origin:52% 50%}
.sw:disabled{opacity:.4;cursor:default}
</style>
<link rel="stylesheet" href="hcdt-ui.css?v=20261029i">
<style>
/* wide workspace: everything on one screen */
html.hx-wide body{height:100vh;overflow:hidden;padding-block:6px}
html.hx-wide .wrap{max-width:none;height:100%;grid-template-rows:auto minmax(0,1fr);gap:8px}
html.hx-wide .hx-steps,html.hx-wide details.spec,html.hx-wide #exwarn,html.hx-wide header p{display:none!important}
html.hx-wide header{padding-bottom:8px}
html.hx-wide main{grid-template-columns:minmax(0,1fr) minmax(0,2fr)!important;grid-template-rows:minmax(0,1fr);gap:12px!important;min-height:0;height:100%}
html.hx-wide .zone{min-height:0;align-self:stretch}
html.hx-wide .zone:first-child{grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);overflow:auto}
html.hx-wide .zone:last-of-type{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr);overflow:auto}
html.hx-wide .zl{padding:12px;border-right:0}
html.hx-wide .zl .pv{position:static}
html.hx-wide .zone:last-of-type .zr{display:contents}
html.hx-wide .zone:last-of-type .zr>.blk:nth-child(1){grid-column:2;grid-row:2/4;overflow:auto;padding:12px 14px}
html.hx-wide .zone:last-of-type .zr>.blk:nth-child(2){grid-column:1;grid-row:3;padding:6px 14px}
html.hx-wide .zone:last-of-type .zr>.blk:nth-child(3){grid-column:1;grid-row:4;padding:6px 14px}
html.hx-wide .zone:last-of-type .zr>.blk{border-top:1px solid var(--line)}
html.hx-wide .zone:last-of-type .zl{grid-column:1;grid-row:2}
html.hx-wide .zone:last-of-type{grid-template-rows:auto auto auto minmax(0,1fr)}
html.hx-wide .zone .blk,html.hx-wide .zone .zr>.blk,html.hx-wide .zone .zl{align-content:start!important}
html.hx-wide .zone:last-of-type{grid-template-rows:auto auto auto minmax(0,1fr)}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1 data-i="h1"></h1>
    <p data-i="sub"></p>
    <div class="tools"><span class="spec">90 × 50 mm</span>
      <div class="lang" role="group" aria-label="Language / 언어"><button type="button" id="lko" lang="ko">한</button><button type="button" id="len" lang="en">EN</button></div>
      <div class="hx-act">
        <div class="hx-menu"><button type="button" class="primary" data-hx-menu aria-haspopup="true" aria-expanded="false">Export ▾</button>
          <div class="hx-menu-pop" hidden>
            <button type="button" class="hx-mi" id="exPdf" data-i="exPdf"></button>
            <button type="button" class="hx-mi" id="exSvgF" data-i="exSvgF"></button>
            <button type="button" class="hx-mi" id="exSvgB" data-i="exSvgB"></button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <main>
    <section class="zone" aria-labelledby="z-front">
      <div class="zh"><h2 id="z-front"><span class="tag f" data-i="front"></span></h2></div>
      <div class="zl"><div class="pv"><div class="side"><div class="cap"><span id="capF"></span></div><div class="card" id="prevF"></div></div></div></div>
      <div class="zr">
        <div class="pk">
          <div class="sub"><span data-i="accS"></span><div class="swatches" id="swA" role="radiogroup" aria-label="Accent"></div></div>
          <div class="sub"><span data-i="version"></span><div class="vtabs" id="vtF" role="radiogroup" aria-label="Version"></div></div>
          <div class="sub"><span data-i="design"></span><div class="thumbs" id="thF"></div></div>
        </div>
      </div>
    </section>

    <section class="zone" aria-labelledby="z-back">
      <div class="zh"><h2 id="z-back"><span class="tag b" data-i="back"></span></h2></div>
      <div class="zl"><div class="pv"><div class="side"><div class="cap"><span id="capB"></span></div><div class="card" id="prevB"></div></div><div class="warn" id="warn" hidden></div></div></div>
      <div class="zr">
        <div class="blk">
          <h3 class="sh" data-i="hInfo"></h3>
          <div class="row2">
          <label><span data-i="lKo"></span><input type="text" id="ko" autocomplete="off"></label>
          <label><span data-i="lEn"></span><input type="text" id="en" autocomplete="off"></label>
        </div>
        <label><span data-i="lTitle"></span><select id="tsel"></select></label>
        <input type="text" id="title" data-ip="lTitleIn" autocomplete="off" hidden>
        <div class="fld"><b>E</b><input type="text" id="email" data-ia="email" data-ip="email" autocomplete="off"></div>
        <div class="fld"><b>O</b><input type="text" id="office" data-ia="office" data-ip="office" autocomplete="off"></div>
        <div class="fld"><b>P</b><input type="text" id="mobile" data-ia="mobile" data-ip="mobile" autocomplete="off"></div>
        <div class="fld"><b>W</b><input type="text" id="web" data-ia="web" data-ip="web" autocomplete="off"></div>
        <div class="fld"><input type="text" id="xlab" class="lab" maxlength="2" data-ia="xlab" placeholder="A"><input type="text" id="xval" data-ia="xval" data-ip="xval" autocomplete="off"></div>
          <div class="btns"><button type="button" id="clear" data-i="clear"></button><button type="button" id="sample" data-i="sample"></button></div>
        </div>
        <div class="blk">
          <h3 class="sh" data-i="hDesignB"></h3>
          <div class="pk">
            <div class="sub"><span data-i="version"></span><div class="vtabs" id="vtB" role="radiogroup" aria-label="Version"></div></div>
            <div class="sub"><span data-i="design"></span><div class="thumbs" id="thB"></div></div>
          </div>
        </div>
        <div class="blk">
          <h3 class="sh" data-i="hOv"></h3>
          <div class="ovwrap">
          <div class="ovr" id="ovr"></div>
          <div class="cncol"><span class="cnh" data-i="hCn"></span><div class="cnb" id="cnb" role="radiogroup" aria-label="Connector"></div></div>
          </div>
        </div>
      </div>
    </section>

    <div class="warn" id="exwarn" hidden></div>

    <details class="panel spec">
        <summary data-i="hSpec"></summary>
        <div class="tw"><table>
          <tr><th data-i="thItem"></th><th data-i="thVal"></th></tr>
          <tr><td data-i="sSize"></td><td>312.3 × 173.6 = 90 × 50 mm (1.80)</td></tr>
          <tr><td data-i="sColor"></td><td>#6B00FF · #001B54 · #64D8D8 · #E8B9AA · #73D888 · #E8E041</td></tr>
          <tr><td data-i="sVer"></td><td data-i="sVerV"></td></tr>
          <tr><td data-i="sName"></td><td data-i="sNameV"></td></tr>
          <tr><td data-i="sCn"></td><td data-i="sCnV"></td></tr>
          <tr><td data-i="sBody"></td><td data-i="sBodyV"></td></tr>
        </table></div>
      </details>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

<script src="lib/opentype.min.js"></script>
<script src="lib/jspdf.umd.min.js"></script>

  /* 포인트색(앞·뒷면 공통) */
  const swA=$('swA');
  if(!swA.children.length)ACC.forEach(c=>mkSw(swA,c,()=>{st.a=c;render()}));
  [...swA.children].forEach((el,j)=>{const c=ACC[j];el.setAttribute('aria-checked',c===st.a);el.title=cname(c)+' '+c;el.setAttribute('aria-label',cname(c));el.disabled=st.f.v===5});
  renderOv();
  [...$('cnb').children].forEach((el,j)=>el.setAttribute('aria-checked',j===st.cn));
  const w=$('warn');w.hidden=!warns.length;w.innerHTML=[...new Set(warns)].map(x=>`<span>${esc(x)}</span>`).join('');
  syncTitle();
  const bad=miss.length>0;['exPdf','exSvgF','exSvgB'].forEach(k=>$(k).disabled=bad);
  const ew=$('exwarn');ew.hidden=!bad;ew.innerHTML=bad?`<span>${esc(t('wMiss',miss.join(' ')))}</span>`:'';
  try{localStorage.setItem('namecard-v5',JSON.stringify({D,st}))}catch(e){}
}
function mkSw(box,c,fn){
  const b=document.createElement('button');b.type='button';b.className='sw';b.setAttribute('role','radio');
  b.style.setProperty('--c',c);b.onclick=fn;box.appendChild(b);return b;
}
const OVL={lab:'oLab',bar:'oBar',en:'oEn',ti:'oTi'},OVS={lab:'oLabS',bar:'oBarS',en:'oEnS',ti:'oTiS'};
function buildOv(){
  const box=$('ovr');box.innerHTML='';
  OVK.forEach(k=>{
    const g=document.createElement('div');g.className='og';g.dataset.k=k;
    g.innerHTML='<span><b></b><small></small></span><div class="swatches" role="radiogroup"></div>';
    box.appendChild(g);
  });
}
const ovName=c=>c==='A'?(LANG==='ko'?'포인트색':'Accent'):cname(c);
function renderOv(){
  const nv=st.f.v===1&&st.b.v===1;const opts=nv?[BLK,NAVY,PUR,'A']:[BLK,PUR,'A'];
  OVK.forEach(k=>{
    if(st.ov[k]&&!opts.includes(st.ov[k]))st.ov[k]=null;
    const g=document.querySelector(`.og[data-k="${k}"]`),sw=g.lastChild,head=g.firstChild;
    head.firstChild.textContent=t(OVL[k]);head.lastChild.textContent=t(OVS[k]);
    if(sw.dataset.v!==String(nv)){
      sw.innerHTML='';sw.dataset.v=String(nv);
      opts.forEach(c=>{const b=mkSw(sw,c,()=>{st.ov[k]=st.ov[k]===c?null:c;render()});if(c===BLK)b.classList.add('k')});
    }
    [...sw.children].forEach((el,j)=>{const c=opts[j];el.style.setProperty('--c',c==='A'?st.a:c);el.setAttribute('aria-checked',st.ov[k]===c);el.title=ovName(c);el.setAttribute('aria-label',ovName(c))});
  });
}
const TITLES=[['Full Professor','교수'],['Associate Professor','부교수'],['Assistant Professor','조교수'],['Postdoctoral Researcher','포닥'],['Ph.D. Student','박사과정'],['M.S. Student','석사과정'],['Undergraduate Student','학부생']];
let customT=false;
/* 직책 드롭다운: 선택 안 함 · 7개 직책 · 직접 입력 */
function buildTitles(){
  const sel=$('tsel');
  sel.innerHTML='';
  ['',...TITLES.map(x=>x[0]),'__custom'].forEach(v=>{const o=document.createElement('option');o.value=v;sel.appendChild(o)});
  sel.onchange=()=>{
    if(sel.value==='__custom'){customT=true;$('title').value='';$('title').hidden=false;$('title').focus()}
    else{customT=false;$('title').value=sel.value}
    render();
  };
}
function syncTitle(){
  const v=$('title').value.trim(),idx=TITLES.findIndex(x=>x[0]===v);
  if(idx<0&&v)customT=true;
  const sel=$('tsel');
  [...sel.options].forEach((o,i)=>{
    if(i===0)o.textContent=t('tNone');
    else if(i===sel.options.length-1)o.textContent=t('tCustom');
    else o.textContent=TITLES[i-1][0]+(LANG==='ko'?'  ('+TITLES[i-1][1]+')':'');
  });
  sel.value=customT?'__custom':(idx>=0?TITLES[idx][0]:'');
  $('title').hidden=!customT;
}
function buildPicks(){
  ['f','b'].forEach(k=>{
    const K=k.toUpperCase(),box=$('vt'+K);
    VERS.forEach((V,j)=>{
      const b=document.createElement('button');b.type='button';b.className='vt';b.setAttribute('role','radio');b.innerHTML='<b></b><small></small>';
      b.onclick=()=>{setVer(k,j+1);render()};box.appendChild(b);
    });
  });
}
function buildConn(){
  const box=$('cnb');
  const names=['cnNone','cnDash','cnPlus','cnBar'];
  const icons=['','<rect x="2" y="7.2" width="12" height="1.6"/>','<rect x="7" y="2" width="2" height="12"/><rect x="2" y="7" width="12" height="2"/>','<rect x="7.2" y="2" width="1.6" height="12"/>'];
  names.forEach((n,j)=>{
    const b=document.createElement('button');b.type='button';b.className='cb';b.setAttribute('role','radio');
    b.innerHTML=`<svg viewBox="0 0 16 16" aria-hidden="true">${icons[j]}</svg><span data-i="${n}"></span>`;
    b.onclick=()=>{st.cn=j;render()};box.appendChild(b);
  });
}
function relang(){applyLang();render()}

/* 내보내기 */
let tt;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200)}
async function saveFile(name,blob){
  try{
    const dl=window.claude&&await claude.use('downloads');
    if(dl){await dl.save({filename:name,data:blob});toast(t('tSaved',name));return}
  }catch(e){if(e&&e.code==='declined')return;if(e&&e.code&&e.code!=='unavailable'&&e.code!=='not_granted'){toast(t('tFail',e.code));return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast(t('tSaved',name));
}
function fname(side){const n=(($('en').value.trim()||$('ko').value.trim())||'namecard').replace(/[^\p{L}\p{N}_-]+/gu,'_');return `NFUD_namecard_${n}_${side}`}
function exSvg(side){
  const D=data(),ex=`width="90mm" height="50mm"`;
  const s=side==='front'?svgFront(st.f,ex):svgBack(st.b,D,null,ex);
  saveFile(fname(side)+'.svg',new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+s],{type:'image/svg+xml'}));
}
async function exPdf(){
  if(!window.jspdf){toast(t('tLib'));return}
  const btn=$('exPdf');btn.disabled=true;
  try{
    const D=data();
    const doc=new jspdf.jsPDF({unit:'mm',format:[90,50],orientation:'landscape',compress:true});
    const host=document.createElement('div');host.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(host);
    for(const [k,side] of [[0,'f'],[1,'b']]){
      host.innerHTML=side==='f'?svgFront(st.f,`width="${W}" height="${H}"`):svgBack(st.b,D,null,`width="${W}" height="${H}"`);
      if(k)doc.addPage([90,50],'landscape');
      await doc.svg(host.firstElementChild,{x:0,y:0,width:90,height:50});
    }
    host.remove();
    await saveFile(fname('card')+'.pdf',doc.output('blob'));
  }catch(e){console.error(e);toast(t('tPdf',e.message||e))}
  finally{btn.disabled=false;render()}
}

/* 초기화 */
function setData(o){customT=false;IDS.forEach(i=>$(i).value=o[i]||'')}
function init(){
  let saved=null;try{saved=JSON.parse(localStorage.getItem('namecard-v5')||'null')}catch(e){}
  setData(saved&&saved.D?saved.D:SAMPLE);
  if(saved&&saved.st){
    if(ACC.includes(saved.st.a))st.a=saved.st.a;
    OVK.forEach(k=>{const c=saved.st.ov&&saved.st.ov[k];st.ov[k]=(c==='A'||c===BLK||c===NAVY||c===PUR)?c:null});
    st.cn=Math.min(Math.max(saved.st.cn|0,0),3);
  }
  LANG=(function(){try{var v=localStorage.getItem('hcdt-lang');return v==='ko'?'ko':'en'}catch(e){return 'en'}})();
  try{F.R=opentype.parse(b64buf(FONT_B64.R));F.B=opentype.parse(b64buf(FONT_B64.B));F.K=opentype.parse(b64buf(FONT_B64.K))}catch(e){console.error(e)}
  buildPicks();buildOv();buildTitles();buildConn();applyLang();render();
  $('lko').onclick=()=>{LANG='ko';relang()};$('len').onclick=()=>{LANG='en';relang()};
  IDS.forEach(i=>$(i).addEventListener('input',render));
  $('clear').onclick=()=>{setData({});render();$('ko').focus()};
  $('sample').onclick=()=>{setData(SAMPLE);render()};
  $('exPdf').onclick=exPdf;$('exSvgF').onclick=()=>exSvg('front');$('exSvgB').onclick=()=>exSvg('back');
}
init();
