<meta charset="utf-8">
<title>명함 생성기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 좌측 입력 패널 + 우측 앞/뒷면 미리보기, 하단에 시안·색상 선택. 카드는 실제 비율(90×50mm) 유지 */
:root{
  --bg:#f3f2f6; --panel:#ffffff; --fg:#17151c; --muted:#6a6675; --line:#dedce6;
  --accent:#6b00ff; --accent-fg:#ffffff; --accent-soft:#ece3ff; --stage:#e6e4ec; --warn:#a8460a; --warn-bg:#fff0e3;
  --font-ui:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121016; --panel:#1b1821; --fg:#eeecf3; --muted:#9a96a7; --line:#322e3b;
  --accent:#9a66ff; --accent-fg:#120a24; --accent-soft:#2a1f45; --stage:#0c0b10; --warn:#ffb27a; --warn-bg:#35210f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121016; --panel:#1b1821; --fg:#eeecf3; --muted:#9a96a7; --line:#322e3b;
  --accent:#9a66ff; --accent-fg:#120a24; --accent-soft:#2a1f45; --stage:#0c0b10; --warn:#ffb27a; --warn-bg:#35210f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.55;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;border-bottom:2px solid var(--fg);padding-bottom:12px}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:13px}
header .lang{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-left:12px}
header .lang button{border:0;border-radius:0;padding:5px 12px;font-family:var(--font-mono);font-size:12px;background:var(--panel);color:var(--muted)}
header .lang button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);font-weight:700}
header .tools{margin-left:auto;display:flex;align-items:center}
header .spec{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
main{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}}
section.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:12px;min-width:0}
h2{font-size:12px;margin:0;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
input[type=text]{font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;min-width:0}
input[type=text]:focus-visible,button:focus-visible,.pick:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.fld{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center}
.fld b{font-family:var(--font-mono);font-size:13px;text-align:center;color:var(--accent)}
.fld .lab{width:100%;text-align:center;padding:8px 2px;font-family:var(--font-mono);font-weight:500}
button{font:inherit;font-size:13px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.stage{background:var(--stage);border-radius:6px;padding:20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:640px){.stage{grid-template-columns:minmax(0,1fr);padding:14px}}
.side{display:grid;gap:8px;min-width:0}
.side .cap{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;font-family:var(--font-mono)}
.card{box-shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.18);background:#fff;line-height:0;max-width:100%}
.card svg{display:block;width:100%;height:auto}
.picks{display:grid;gap:18px}
.pk{display:grid;gap:10px}
.pk>h3{margin:0;font-size:13px;font-weight:700}
.sub{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center}
.sub[hidden]{display:none}
.sub>span{font-size:12px;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:480px){.thumbs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pick{padding:0;border:2px solid var(--line);background:#fff;line-height:0;border-radius:3px;cursor:pointer;position:relative}
.pick[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pick svg{display:block;width:100%;height:auto}
.pick i{position:absolute;left:2px;top:2px;font:500 9px/1 var(--font-mono);font-style:normal;color:#fff;background:rgba(23,21,28,.7);padding:2px 3px;border-radius:2px}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:8px 10px;font-size:12.5px;display:grid;gap:2px}
.warn[hidden]{display:none}
.note{font-size:12px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:4px;font-size:13px;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
table{border-collapse:collapse;font-size:12.5px;width:100%}
td,th{border-top:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.tw{overflow-x:auto}
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;padding:0;background:var(--c);border:1px solid var(--line);box-shadow:inset 0 0 0 2px var(--panel);cursor:pointer}
.sw.wh{background:#fff}
.sw[aria-checked=true]{outline:2px solid var(--fg);outline-offset:2px}
.cname{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);margin:0}
.tsel{display:grid;gap:6px;font-size:12px;color:var(--muted)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tc{display:grid;gap:0;text-align:left;padding:6px 10px;line-height:1.25;border-radius:4px}
.tc b{font-weight:500;font-size:13px;color:var(--fg)}
.tc small{font-size:11px;color:var(--muted)}
.tc[aria-checked=true]{background:var(--accent);border-color:var(--accent)}
.tc[aria-checked=true] b,.tc[aria-checked=true] small{color:var(--accent-fg)}
.cnb{display:flex;flex-wrap:wrap;gap:6px}
.cb{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:4px}
.cb svg{width:16px;height:16px;fill:currentColor}
.cb[aria-checked=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.chk input{accent-color:var(--accent)}
.gap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.gap input{width:100%;accent-color:var(--accent)}
.gap output{font-family:var(--font-mono);font-size:12px;color:var(--muted);min-width:7.5em;text-align:right}
</style>

<div class="wrap">
  <header>
    <h1 data-i="h1"></h1>
    <p data-i="sub"></p>
    <div class="tools"><span class="spec">90 × 50 mm</span>
      <div class="lang" role="group" aria-label="Language / 언어"><button type="button" id="lko" lang="ko">한</button><button type="button" id="len" lang="en">EN</button></div>
    </div>
  </header>

  <main>
    <div style="display:grid;gap:20px;min-width:0">
      <section class="panel" aria-labelledby="h-info">
        <h2 id="h-info" data-i="hInfo"></h2>
        <div class="row2">
          <label><span data-i="lKo"></span><input type="text" id="ko" autocomplete="off"></label>
          <label><span data-i="lEn"></span><input type="text" id="en" autocomplete="off"></label>
        </div>
        <div class="tsel"><span class="lbl" data-i="lTitle"></span><div class="tchips" id="tchips" role="radiogroup" aria-label="Title"></div><input type="text" id="title" data-ip="lTitle" autocomplete="off" hidden></div>
        <div class="fld"><b>E</b><input type="text" id="email" data-ia="email" data-ip="email" autocomplete="off"></div>
        <div class="fld"><b>O</b><input type="text" id="office" data-ia="office" data-ip="office" autocomplete="off"></div>
        <div class="fld"><b>P</b><input type="text" id="mobile" data-ia="mobile" data-ip="mobile" autocomplete="off"></div>
        <div class="fld"><b>W</b><input type="text" id="web" data-ia="web" data-ip="web" autocomplete="off"></div>
        <div class="fld"><input type="text" id="xlab" class="lab" maxlength="2" data-ia="xlab" placeholder="A"><input type="text" id="xval" data-ia="xval" data-ip="xval" autocomplete="off"></div>
        <p class="note" data-i="noteRows"></p>
        <div class="btns"><button type="button" id="clear" data-i="clear"></button><button type="button" id="sample" data-i="sample"></button></div>
      </section>

      <section class="panel" aria-labelledby="h-cn">
        <h2 id="h-cn" data-i="hCn"></h2>
        <div class="cnb" id="cnb" role="radiogroup" aria-label="Connector"></div>
        <div class="gap"><input type="range" id="gap" min="13" max="20" step="0.1" data-ia="lGap"><output id="gapv" for="gap"></output></div>
        <p class="note" data-i="cnNote"></p>
      </section>

      <section class="panel" aria-labelledby="h-exp">
        <h2 id="h-exp" data-i="hExp"></h2>
        <div class="btns">
          <button type="button" class="primary" id="exPdf" data-i="exPdf"></button>
          <button type="button" id="exSvgF" data-i="exSvgF"></button>
          <button type="button" id="exSvgB" data-i="exSvgB"></button>
        </div>
        <div class="warn" id="exwarn" hidden></div>
        <p class="note" data-i="exNote"></p>
      </section>
    </div>

    <div style="display:grid;gap:20px;min-width:0">
      <section class="stage" aria-label="Preview">
        <div class="side"><div class="cap"><span data-i="front"></span><span id="capF"></span></div><div class="card" id="prevF"></div></div>
        <div class="side"><div class="cap"><span data-i="back"></span><span id="capB"></span></div><div class="card" id="prevB"></div></div>
      </section>
      <div class="warn" id="warn" hidden></div>
      <section class="panel" aria-labelledby="h-rnd">
        <h2 id="h-rnd" data-i="hRnd"></h2>
        <div class="btns">
          <button type="button" class="primary" id="rAll" data-i="rAll"></button>
          <button type="button" id="rF" data-i="rF"></button>
          <button type="button" id="rB" data-i="rB"></button>
          <label class="chk"><input type="checkbox" id="rcol"><span data-i="rCol"></span></label>
        </div>
        <p class="note" data-i="rndNote"></p>
      </section>
      <section class="panel" aria-labelledby="h-pick">
        <h2 id="h-pick" data-i="hPick"></h2>
        <div class="picks">
          <div class="pk">
            <h3 data-i="front"></h3>
            <div class="sub"><span data-i="design"></span><div class="thumbs" id="thF"></div></div>
            <div class="sub"><span data-i="accent"></span><div><div class="swatches" id="swF" role="radiogroup" aria-label="Accent"></div></div></div>
            <div class="sub" id="bgrowF"><span data-i="bg"></span><div><div class="swatches" id="bgF" role="radiogroup" aria-label="Background"></div></div></div>
          </div>
          <div class="pk">
            <h3 data-i="back"></h3>
            <div class="sub"><span data-i="design"></span><div class="thumbs" id="thB"></div></div>
            <div class="sub"><span data-i="accent"></span><div><div class="swatches" id="swB" role="radiogroup" aria-label="Accent"></div></div></div>
            <div class="sub" id="bgrowB"><span data-i="bg"></span><div><div class="swatches" id="bgB" role="radiogroup" aria-label="Background"></div></div></div>
          </div>
        </div>
        <p class="note" data-i="pickNote"></p>
      </section>
      <section class="panel" aria-labelledby="h-spec">
        <h2 id="h-spec" data-i="hSpec"></h2>
        <div class="tw"><table>
          <tr><th data-i="thItem"></th><th data-i="thVal"></th></tr>
          <tr><td data-i="sSize"></td><td>312.3 × 173.6 = 90 × 50 mm (1.80)</td></tr>
          <tr><td data-i="sColor"></td><td>#6B00FF · #4FD7E6 · #F79552 · #5AD67A · #F0C400</td></tr>
          <tr><td data-i="sLogo"></td><td data-i="sLogoV"></td></tr>
          <tr><td data-i="sName"></td><td data-i="sNameV"></td></tr>
          <tr><td data-i="sCn"></td><td data-i="sCnV"></td></tr>
          <tr><td data-i="sRnd"></td><td data-i="sRndV"></td></tr>
          <tr><td data-i="sBody"></td><td data-i="sBodyV"></td></tr>
        </table></div>
      </section>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

let LANG='ko';
const t=(k,...a)=>{const v=I[LANG][k];return typeof v==='function'?v(...a):v};
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=t(e.dataset.i));
  document.querySelectorAll('[data-ia]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.ia)));
  document.querySelectorAll('[data-ip]').forEach(e=>e.setAttribute('placeholder',t(e.dataset.ip)));
  $('lko').setAttribute('aria-pressed',LANG==='ko');$('len').setAttribute('aria-pressed',LANG==='en');
  document.title=t('h1');
  try{localStorage.setItem('namecard-lang',LANG)}catch(e){}
}

function b64buf(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer}
const F={R:null,B:null,K:null};
const HAN=/[ᄀ-ᇿ㄰-㆏가-힯]/;
const SYL=/^[가-힣]$/;

function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function has(f,ch){return !!f&&(ch===' '||f.charToGlyphIndex(ch)>0)}
/* 글자별 글꼴 선택: 한글 칸은 Spoqa 우선, 그 외는 Helvetica 우선(없으면 Spoqa) */
function pick(ch,bold,kr){
  const H=bold?F.B:F.R;
  const order=kr?[F.K,H]:[H,F.K];
  for(const f of order) if(has(f,ch)) return f;
  return null;
}
function runs(str,bold,kr){
  const out=[];
  for(const ch of str){const f=pick(ch,bold,kr),l=out[out.length-1];
    if(l&&l.f===f)l.t+=ch;else out.push({f,t:ch})}
  return out;
}
const SPACE_K=()=>F.K?F.K.getAdvanceWidth(' ',1):0.227;
/* 한글 두 글자 이름은 가이드처럼 글자 사이를 띄움(공백 4칸) */
function koParts(str){
  const c=[...str];
  if(c.length===2&&c.every(x=>SYL.test(x))) return {parts:c,extra:4*SPACE_K()};
  return {parts:[str],extra:0};
}
function width(str,size,bold,kr){
  if(!str)return 0;
  if(kr){const k=koParts(str);let w=0;k.parts.forEach(p=>{for(const r of runs(p,bold,true))w+=r.f?r.f.getAdvanceWidth(r.t,size):0});return w+k.extra*size*(k.parts.length-1)}
  let w=0;for(const r of runs(str,bold,false))w+=r.f?r.f.getAdvanceWidth(r.t,size):0;return w;
}
function text(str,x,y,size,bold,fill,kr){
  if(!str)return '';
  let cx=x,d='';
  const parts=kr?koParts(str):{parts:[str],extra:0};
  parts.parts.forEach((p,i)=>{
    if(i)cx+=parts.extra*size;
    for(const r of runs(p,bold,kr)){
      if(!r.f)continue;
      d+=r.f.getPath(r.t,cx,y,size).toPathData(2);cx+=r.f.getAdvanceWidth(r.t,size);
    }
  });
  return `<path d="${d}" fill="${fill}"/>`;
}
function data(){const o={};IDS.forEach(i=>o[i]=$(i).value.trim());return o}
function missing(D){
  const s=new Set();
  IDS.forEach(k=>{for(const ch of D[k]){if(/\s/.test(ch))continue;if(!pick(ch,k==='en'||k==='ko',k==='ko')&&!pick(ch,false,k==='ko'))s.add(ch)}});
  return [...s];
}

/* 색: 면마다 포인트색(A)과 바탕색. 보라(P)는 로고 글자·도트 등 고정색 */
function pal(s){
  const acc=COL[s.c];
  const solid=s.d===SOLID, bg=solid&&s.bg>0?COL[s.bg-1]:'#fff';
  let P=PUR,A2=acc,T='#000';
  if(bg===PUR){P='#fff';A2=acc===PUR?'#fff':acc;T='#fff'}
  else if(bg!=='#fff'){A2=acc===bg?'#fff':acc}
  return {P,A:A2,T,bg};
}
function wrapSvg(inner,uid,extra,bg){
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" ${extra||''}><defs><clipPath id="${uid}"><rect width="${W}" height="${H}"/></clipPath></defs><rect width="${W}" height="${H}" fill="#fff"/><g clip-path="url(#${uid})"><rect width="${W}" height="${H}" fill="${bg}"/>${inner}</g></svg>`;
}
function deco(idx,p,kind){
  if(idx>=SOLID)return '';
  return A[kind][idx].s.map(([r,d])=>`<path d="${d}" fill="${r==='P'?p.P:p.A}"/>`).join('');
}

/* ---------- 랜덤 배치: 가이드의 대표 그래픽(+ – | 사선, 격자, 줄무늬, 체커, 도트, 모서리)을 1~3겹으로 ---------- */
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
const MODS=[{L:21,T:4.8},{L:14,T:3.2},{L:7,T:1.6}];   /* 한 면은 규격 1종만 사용 */
const f2=v=>+v.toFixed(2);
const rand=(r,a,b)=>a+(b-a)*r(), ri=(r,n)=>Math.floor(r()*n);
const pickK=(r,list,n)=>{const a=list.slice(),o=[];while(o.length<n&&a.length)o.push(a.splice(ri(r,a.length),1)[0]);return o};
const hit=(b,z,m=0)=>!(b[2]+m<=z[0]||b[0]-m>=z[2]||b[3]+m<=z[1]||b[1]-m>=z[3]);
const RP=b=>`M${f2(b[0])} ${f2(b[1])}H${f2(b[2])}V${f2(b[3])}H${f2(b[0])}Z`;
function barG(cx,cy,L,T,a){
  const c=Math.cos(a),s=Math.sin(a),hx=L/2,hy=T/2;
  const P=[[-hx,-hy],[hx,-hy],[hx,hy],[-hx,hy]].map(([x,y])=>[cx+x*c-y*s,cy+x*s+y*c]);
  const X=P.map(p=>p[0]),Y=P.map(p=>p[1]);

  try{F.R=opentype.parse(b64buf(FONT_B64.R));F.B=opentype.parse(b64buf(FONT_B64.B));F.K=opentype.parse(b64buf(FONT_B64.K))}catch(e){console.error(e)}
  buildPicks();buildTitles();buildConn();applyLang();render();
  $('lko').onclick=()=>{LANG='ko';relang()};$('len').onclick=()=>{LANG='en';relang()};
  IDS.forEach(i=>$(i).addEventListener('input',render));
  $('clear').onclick=()=>{setData({});render();$('ko').focus()};
  $('sample').onclick=()=>{setData(SAMPLE);render()};
  const roll=ks=>{ks.forEach(k=>{st[k].d=RAND;st[k].seed=(Math.random()*4294967296)>>>0||1;if($('rcol').checked)st[k].c=Math.floor(Math.random()*5)});render()};
  $('rAll').onclick=()=>roll(['f','b']);$('rF').onclick=()=>roll(['f']);$('rB').onclick=()=>roll(['b']);
  $('exPdf').onclick=exPdf;$('exSvgF').onclick=()=>exSvg('front');$('exSvgB').onclick=()=>exSvg('back');
}
init();
</script>
