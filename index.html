<meta charset="utf-8">
<title>명함 생성기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 레이아웃: 좌측 입력 패널 + 우측 앞/뒷면 미리보기, 하단에 시안·색상 선택. 카드는 실제 비율(90×50mm) 유지 */
:root{
  --bg:#f3f2f6; --panel:#ffffff; --fg:#17151c; --muted:#6a6675; --line:#dedce6;
  --accent:#6b00ff; --accent-fg:#ffffff; --accent-soft:#ece3ff; --stage:#e6e4ec; --warn:#a8460a; --warn-bg:#fff0e3;
  --font-ui:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121016; --panel:#1b1821; --fg:#eeecf3; --muted:#9a96a7; --line:#322e3b;
  --accent:#9a66ff; --accent-fg:#120a24; --accent-soft:#2a1f45; --stage:#0c0b10; --warn:#ffb27a; --warn-bg:#35210f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121016; --panel:#1b1821; --fg:#eeecf3; --muted:#9a96a7; --line:#322e3b;
  --accent:#9a66ff; --accent-fg:#120a24; --accent-soft:#2a1f45; --stage:#0c0b10; --warn:#ffb27a; --warn-bg:#35210f; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.55;
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:24px 48px}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;border-bottom:2px solid var(--fg);padding-bottom:12px}
h1{font-size:22px;margin:0;font-weight:700;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-size:13px}
header .lang{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden;margin-left:12px}
header .lang button{border:0;border-radius:0;padding:5px 12px;font-family:var(--font-mono);font-size:12px;background:var(--panel);color:var(--muted)}
header .lang button[aria-pressed=true]{background:var(--accent);color:var(--accent-fg);font-weight:700}
header .tools{margin-left:auto;display:flex;align-items:center}
header .spec{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
main{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr)}}
section.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;display:grid;gap:12px;min-width:0}
h2{font-size:12px;margin:0;font-weight:700;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
input[type=text]{font:inherit;font-size:14px;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;min-width:0}
input[type=text]:focus-visible,button:focus-visible,.pick:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.fld{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;align-items:center}
.fld b{font-family:var(--font-mono);font-size:13px;text-align:center;color:var(--accent)}
.fld .lab{width:100%;text-align:center;padding:8px 2px;font-family:var(--font-mono);font-weight:500}
button{font:inherit;font-size:13px;border-radius:4px;border:1px solid var(--line);background:var(--panel);color:var(--fg);padding:8px 12px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
button:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.stage{background:var(--stage);border-radius:6px;padding:20px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media (max-width:640px){.stage{grid-template-columns:minmax(0,1fr);padding:14px}}
.side{display:grid;gap:8px;min-width:0}
.side .cap{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;font-family:var(--font-mono)}
.card{box-shadow:0 1px 2px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.18);background:#fff;line-height:0;max-width:100%}
.card svg{display:block;width:100%;height:auto}
.picks{display:grid;gap:18px}
.pk{display:grid;gap:10px}
.pk>h3{margin:0;font-size:13px;font-weight:700}
.sub{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:center}
.sub[hidden]{display:none}
.sub>span{font-size:12px;color:var(--muted)}
.thumbs{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
@media (max-width:480px){.thumbs{grid-template-columns:repeat(4,minmax(0,1fr))}}
.pick{padding:0;border:2px solid var(--line);background:#fff;line-height:0;border-radius:3px;cursor:pointer;position:relative}
.pick[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.pick svg{display:block;width:100%;height:auto}
.pick i{position:absolute;left:2px;top:2px;font:500 9px/1 var(--font-mono);font-style:normal;color:#fff;background:rgba(23,21,28,.7);padding:2px 3px;border-radius:2px}
.warn{background:var(--warn-bg);color:var(--warn);border-radius:4px;padding:8px 10px;font-size:12.5px;display:grid;gap:2px}
.warn[hidden]{display:none}
.note{font-size:12px;color:var(--muted);margin:0}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:4px;font-size:13px;max-width:calc(100% - 32px)}
.toast[hidden]{display:none}
table{border-collapse:collapse;font-size:12.5px;width:100%}
td,th{border-top:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
.tw{overflow-x:auto}
.swatches{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;padding:0;background:var(--c);border:1px solid var(--line);box-shadow:inset 0 0 0 2px var(--panel);cursor:pointer}
.sw.wh{background:#fff}
.sw[aria-checked=true]{outline:2px solid var(--fg);outline-offset:2px}
.cname{font-family:var(--font-mono);font-size:11.5px;color:var(--muted);margin:0}
.tsel{display:grid;gap:6px;font-size:12px;color:var(--muted)}
.tchips{display:flex;flex-wrap:wrap;gap:6px}
.tc{display:grid;gap:0;text-align:left;padding:6px 10px;line-height:1.25;border-radius:4px}
.tc b{font-weight:500;font-size:13px;color:var(--fg)}
.tc small{font-size:11px;color:var(--muted)}
.tc[aria-checked=true]{background:var(--accent);border-color:var(--accent)}
.tc[aria-checked=true] b,.tc[aria-checked=true] small{color:var(--accent-fg)}
.cnb{display:flex;flex-wrap:wrap;gap:6px}
.cb{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:4px}
.cb svg{width:16px;height:16px;fill:currentColor}
.cb[aria-checked=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.chk input{accent-color:var(--accent)}
.gap{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.gap input{width:100%;accent-color:var(--accent)}
.gap output{font-family:var(--font-mono);font-size:12px;color:var(--muted);min-width:7.5em;text-align:right}
.vtabs{display:flex;gap:6px;flex-wrap:wrap}
.vt{display:grid;gap:0;text-align:left;padding:6px 10px;line-height:1.25;border-radius:4px}
.vt b{font-weight:700;font-size:13px}
.vt small{font-size:11px;color:var(--muted)}
.vt[aria-checked=true]{background:var(--accent);border-color:var(--accent)}
.vt[aria-checked=true] b,.vt[aria-checked=true] small{color:var(--accent-fg)}
.ovr{display:grid;gap:12px}
.og{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;align-items:center}
.og>span{font-size:12px;color:var(--muted)}
.sw.k{background:#000}
.og .sw:not(.def){width:24px;height:24px}
.og .swatches{gap:8px}
.sw.def{width:auto;border-radius:4px;padding:0 10px;height:30px;font-size:12px;background:var(--panel);color:var(--fg)}
.sw.def[aria-checked=true]{outline:2px solid var(--fg);outline-offset:2px}
.thumbs{grid-template-columns:repeat(5,minmax(0,1fr))}
</style>

<div class="wrap">
  <header>
    <h1 data-i="h1"></h1>
    <p data-i="sub"></p>
    <div class="tools"><span class="spec">90 × 50 mm</span>
      <div class="lang" role="group" aria-label="Language / 언어"><button type="button" id="lko" lang="ko">한</button><button type="button" id="len" lang="en">EN</button></div>
    </div>
  </header>

  <main>
    <div style="display:grid;gap:20px;min-width:0">
      <section class="panel" aria-labelledby="h-info">
        <h2 id="h-info" data-i="hInfo"></h2>
        <div class="row2">
          <label><span data-i="lKo"></span><input type="text" id="ko" autocomplete="off"></label>
          <label><span data-i="lEn"></span><input type="text" id="en" autocomplete="off"></label>
        </div>
        <div class="tsel"><span class="lbl" data-i="lTitle"></span><div class="tchips" id="tchips" role="radiogroup" aria-label="Title"></div><input type="text" id="title" data-ip="lTitle" autocomplete="off" hidden></div>
        <div class="fld"><b>E</b><input type="text" id="email" data-ia="email" data-ip="email" autocomplete="off"></div>
        <div class="fld"><b>O</b><input type="text" id="office" data-ia="office" data-ip="office" autocomplete="off"></div>
        <div class="fld"><b>P</b><input type="text" id="mobile" data-ia="mobile" data-ip="mobile" autocomplete="off"></div>
        <div class="fld"><b>W</b><input type="text" id="web" data-ia="web" data-ip="web" autocomplete="off"></div>
        <div class="fld"><input type="text" id="xlab" class="lab" maxlength="2" data-ia="xlab" placeholder="A"><input type="text" id="xval" data-ia="xval" data-ip="xval" autocomplete="off"></div>
        <p class="note" data-i="noteRows"></p>
        <div class="btns"><button type="button" id="clear" data-i="clear"></button><button type="button" id="sample" data-i="sample"></button></div>
      </section>

      <section class="panel" aria-labelledby="h-ov">
        <h2 id="h-ov" data-i="hOv"></h2>
        <div class="ovr" id="ovr"></div>
        <p class="note" data-i="ovNote"></p>
      </section>

      <section class="panel" aria-labelledby="h-cn">
        <h2 id="h-cn" data-i="hCn"></h2>
        <div class="cnb" id="cnb" role="radiogroup" aria-label="Connector"></div>
        <div class="gap"><input type="range" id="gap" min="13" max="20" step="0.1" data-ia="lGap"><output id="gapv" for="gap"></output></div>
        <p class="note" data-i="cnNote"></p>
      </section>

      <section class="panel" aria-labelledby="h-exp">
        <h2 id="h-exp" data-i="hExp"></h2>
        <div class="btns">
          <button type="button" class="primary" id="exPdf" data-i="exPdf"></button>
          <button type="button" id="exSvgF" data-i="exSvgF"></button>
          <button type="button" id="exSvgB" data-i="exSvgB"></button>
        </div>
        <div class="warn" id="exwarn" hidden></div>
        <p class="note" data-i="exNote"></p>
      </section>
    </div>

    <div style="display:grid;gap:20px;min-width:0">
      <section class="stage" aria-label="Preview">
        <div class="side"><div class="cap"><span data-i="front"></span><span id="capF"></span></div><div class="card" id="prevF"></div></div>
        <div class="side"><div class="cap"><span data-i="back"></span><span id="capB"></span></div><div class="card" id="prevB"></div></div>
      </section>
      <div class="warn" id="warn" hidden></div>
      <section class="panel" aria-labelledby="h-pick">
        <h2 id="h-pick" data-i="hPick"></h2>
        <div class="picks">
          <div class="pk">
            <h3 data-i="front"></h3>
            <div class="sub"><span data-i="version"></span><div class="vtabs" id="vtF" role="radiogroup" aria-label="Version"></div></div>
            <div class="sub"><span data-i="design"></span><div class="thumbs" id="thF"></div></div>
            <div class="sub" id="accrowF"><span data-i="accent"></span><div><div class="swatches" id="swF" role="radiogroup" aria-label="Accent"></div></div></div>
            <div class="sub" id="patrowF" hidden><span data-i="patAcc"></span><div><div class="swatches" id="spF" role="radiogroup" aria-label="Pattern accent"></div></div></div>
          </div>
          <div class="pk">
            <h3 data-i="back"></h3>
            <div class="sub"><span data-i="version"></span><div class="vtabs" id="vtB" role="radiogroup" aria-label="Version"></div></div>
            <div class="sub"><span data-i="design"></span><div class="thumbs" id="thB"></div></div>
            <div class="sub" id="accrowB"><span data-i="accent"></span><div><div class="swatches" id="swB" role="radiogroup" aria-label="Accent"></div></div></div>
          </div>
        </div>
        <p class="note" data-i="pickNote"></p>
      </section>
      <section class="panel" aria-labelledby="h-spec">
        <h2 id="h-spec" data-i="hSpec"></h2>
        <div class="tw"><table>
          <tr><th data-i="thItem"></th><th data-i="thVal"></th></tr>
          <tr><td data-i="sSize"></td><td>312.3 × 173.6 = 90 × 50 mm (1.80)</td></tr>
          <tr><td data-i="sColor"></td><td>#6B00FF · #001B54 · #4FD7E6 · #F79552 · #5AD67A · #F0C400</td></tr>
          <tr><td data-i="sVer"></td><td data-i="sVerV"></td></tr>
          <tr><td data-i="sName"></td><td data-i="sNameV"></td></tr>
          <tr><td data-i="sCn"></td><td data-i="sCnV"></td></tr>
          <tr><td data-i="sBody"></td><td data-i="sBodyV"></td></tr>
        </table></div>
      </section>
    </div>
  </main>
</div>
<div class="toast" id="toast" role="status" hidden></div>

  const kW=()=>width(D.ko,size,true,true),eW=()=>width(D.en,size,true,false);
  const avail=LIM-d.x;
  let tot=kW()+gap+eW();
  if(tot>avail&&tot>0){const k=Math.max(.78,avail/tot);size=NS*k;gap*=k;tot=kW()+gap+eW();if(tot>avail+.01&&warns)warns.push(t('wName'))}
  let x=d.x;
  if(hasK){o+=text(D.ko,x,d.ny,+size.toFixed(2),true,BLK,true);x+=kW()}
  if(both){ if(st.cn)o+=conn(st.cn,x+gap/2,d.ny,o2.bar); x+=gap }
  if(hasE)o+=text(D.en,x,d.ny,+size.toFixed(2),true,o2.en,false);
  o+=text(D.title,d.x+.9,d.ty,BS,false,o2.ti);
  const rows=[['E',D.email],['O',D.office],['P',D.mobile],['W',D.web],[D.xlab||'·',D.xval]].filter(r=>r[1]);
  rows.forEach((r,k)=>{
    const y=+(d.ly-(rows.length-1-k)*PITCH).toFixed(2);
    o+=text(r[0],d.x,y,BS,true,o2.lab)+text(r[1],d.x+13.3,y,BS,false,BLK);
    const w=width(r[1],BS,false);
    if(warns&&d.x+13.3+w>LIM)warns.push(t('wRow',r[1]));
  });
  if(warns&&rows.length){const top=d.ly-(rows.length-1)*PITCH;if(top<d.ty+11)warns.push(t('wMany'))}
  return {bg:'#fff',inner:paths(a.pat,col)+o};
}
let uidN=0;
function svgFront(s,extra){const u='cf'+(uidN++),r=frontSvgInner(s);return wrapSvg(r.inner,u,extra,r.bg)}
function svgBack(s,D,warns,extra){const u='cb'+(uidN++),r=backSvgInner(s,D,warns);return wrapSvg(r.inner,u,extra,r.bg)}

function setVer(side,v){
  const s=st[side],V=VERS[v-1];
  s.v=v;s.i=0;
  if(!V.acc.includes(s.a))s.a=(V[side==='f'?'f':'b'][0].la)||V.acc[0];
  s.pa=null;
}
function render(){
  const D=data(),warns=[],miss=missing(D);
  if(miss.length)warns.push(t('wMiss',miss.join(' ')));
  $('prevF').innerHTML=svgFront(st.f);
  $('prevB').innerHTML=svgBack(st.b,D,warns);
  $('capF').textContent=t('V')[st.f.v-1]+' · '+t('cd',st.f.i+1);
  $('capB').textContent=t('V')[st.b.v-1]+' · '+t('cd',st.b.i+1);
  ['f','b'].forEach(k=>{
    const s=st[k],K=k.toUpperCase(),V=VERS[s.v-1],list=V[k];
    [...$('vt'+K).children].forEach((el,j)=>{el.setAttribute('aria-checked',j+1===s.v);el.firstChild.textContent=(j+1)+' · '+t('V')[j];el.lastChild.textContent=t('VS')[j]});
    const box=$('th'+K);
    if(box.children.length!==list.length||box.dataset.v!==String(s.v)){
      box.innerHTML='';box.dataset.v=s.v;
      list.forEach((d,i)=>{const b=document.createElement('button');b.type='button';b.className='pick';b.innerHTML='<span style="display:block"></span><i>'+String(i+1).padStart(2,'0')+'</i>';b.onclick=()=>{s.i=i;s.pa=null;render()};box.appendChild(b)});
    }
    [...box.children].forEach((el,i)=>{
      const tmp={v:s.v,i,a:s.a,pa:s.pa};
      el.setAttribute('aria-pressed',i===s.i);
      const lab=t('cd',i+1);el.title=lab;el.setAttribute('aria-label',t('f'+K)+lab);
      el.firstChild.innerHTML=k==='f'?svgFront(tmp):svgBack(tmp,D,null);
    });
    const dd=list[s.i];
    const noAcc=k==='f'&&dd.mono;
    $('accrow'+K).hidden=noAcc;
    const sw=$('sw'+K);
    if(sw.dataset.v!==String(s.v)){sw.innerHTML='';sw.dataset.v=s.v;V.acc.forEach(c=>mkSw(sw,c,()=>{s.a=c;render()}))}
    [...sw.children].forEach((el,j)=>{const c=V.acc[j];el.setAttribute('aria-checked',c===s.a);el.title=cname(c)+' '+c;el.setAttribute('aria-label',cname(c))});
  });
  /* 패턴 색(앞면 3버전 4번 시안) */
  const fd=des(st.f,'f'),split=!!fd.pa;
  $('patrowF').hidden=!split;
  if(split){
    const V=VERS[st.f.v-1],sp=$('spF');
    if(sp.dataset.v!==String(st.f.v)){sp.innerHTML='';sp.dataset.v=st.f.v;V.acc.forEach(c=>mkSw(sp,c,()=>{st.f.pa=c;render()}))}
    const cur=st.f.pa==null?fd.pa:st.f.pa;
    [...sp.children].forEach((el,j)=>{const c=V.acc[j];el.setAttribute('aria-checked',c===cur);el.title=cname(c)+' '+c;el.setAttribute('aria-label',cname(c))});
  }
  renderOv();
  [...$('cnb').children].forEach((el,j)=>el.setAttribute('aria-checked',j===st.cn));
  $('gap').value=st.gap;$('gapv').textContent=t('gapV',st.gap);
  $('gap').disabled=!(D.ko&&D.en);
  const w=$('warn');w.hidden=!warns.length;w.innerHTML=[...new Set(warns)].map(x=>`<span>${esc(x)}</span>`).join('');
  syncTitle();
  const bad=miss.length>0;['exPdf','exSvgF','exSvgB'].forEach(k=>$(k).disabled=bad);
  const ew=$('exwarn');ew.hidden=!bad;ew.innerHTML=bad?`<span>${esc(t('wMiss',miss.join(' ')))}</span>`:'';
  try{localStorage.setItem('namecard-v3',JSON.stringify({D,st}))}catch(e){}
}
function mkSw(box,c,fn){
  const b=document.createElement('button');b.type='button';b.className='sw';b.setAttribute('role','radio');
  b.style.setProperty('--c',c);b.onclick=fn;box.appendChild(b);return b;
}
const OVL={lab:'oLab',bar:'oBar',en:'oEn',ti:'oTi'};
function buildOv(){
  const box=$('ovr');box.innerHTML='';
  OVK.forEach(k=>{
    const g=document.createElement('div');g.className='og';g.dataset.k=k;
    g.innerHTML=`<span data-i="${OVL[k]}"></span><div class="swatches" role="radiogroup"></div>`;
    box.appendChild(g);
  });
}
function renderOv(){
  const V=VERS[st.b.v-1],d=des(st.b,'b'),C=colorsOf(st.b,'b');
  const def={lab:d.lab==='A'?C.A:d.lab,bar:d.bar==='A'?C.A:d.bar,en:BLK,ti:BLK};
  const opts=V.ov;
  OVK.forEach(k=>{
    /* 버전 팔레트 밖의 지정색은 기본으로 되돌림 */
    if(st.ov[k]&&!opts.includes(st.ov[k]))st.ov[k]=null;
    const g=document.querySelector(`.og[data-k="${k}"]`),sw=g.lastChild;
    g.firstChild.textContent=t(OVL[k]);
    if(sw.dataset.v!==String(st.b.v)){
      sw.innerHTML='';sw.dataset.v=st.b.v;
      const b0=document.createElement('button');b0.type='button';b0.className='sw def';b0.setAttribute('role','radio');b0.onclick=()=>{st.ov[k]=null;render()};sw.appendChild(b0);
      opts.forEach(c=>{const b=mkSw(sw,c,()=>{st.ov[k]=c;render()});if(c===BLK)b.classList.add('k')});
    }
    sw.firstChild.textContent=t('def');
    sw.firstChild.setAttribute('aria-checked',st.ov[k]==null);
    [...sw.children].slice(1).forEach((el,j)=>{const c=opts[j];el.setAttribute('aria-checked',st.ov[k]===c);el.title=cname(c);el.setAttribute('aria-label',cname(c))});
  });
}
const TITLES=[['Full Professor','교수'],['Associate Professor','부교수'],['Assistant Professor','조교수'],['Postdoctoral Researcher','포닥'],['Ph.D. Student','박사과정'],['M.S. Student','석사과정'],['Undergraduate Student','학부생']];
let customT=false;
function buildTitles(){
  const box=$('tchips');
  [...TITLES,['','custom']].forEach((T,i)=>{
    const b=document.createElement('button');b.type='button';b.className='tc';b.setAttribute('role','radio');
    b.innerHTML='<b></b><small></small>';
    b.onclick=()=>{
      if(i===TITLES.length){customT=!customT;if(customT){$('title').value='';$('title').hidden=false;$('title').focus()}}
      else{customT=false;$('title').value=($('title').value.trim()===T[0])?'':T[0]}
      render();
    };
    box.appendChild(b);
  });
}
function syncTitle(){
  const v=$('title').value.trim(),idx=TITLES.findIndex(x=>x[0]===v);
  if(idx<0&&v)customT=true;
  [...$('tchips').children].forEach((el,i)=>{
    const last=i===TITLES.length;
    el.setAttribute('aria-checked',last?customT:(!customT&&i===idx));
    el.firstChild.textContent=last?t('tCustom'):TITLES[i][0];
    el.lastChild.textContent=last?'':(LANG==='ko'?TITLES[i][1]:'');
    el.lastChild.hidden=last||LANG!=='ko';
  });
  $('title').hidden=!customT;
}
function buildPicks(){
  ['f','b'].forEach(k=>{
    const K=k.toUpperCase(),box=$('vt'+K);
    VERS.forEach((V,j)=>{
      const b=document.createElement('button');b.type='button';b.className='vt';b.setAttribute('role','radio');b.innerHTML='<b></b><small></small>';
      b.onclick=()=>{setVer(k,j+1);render()};box.appendChild(b);
    });
  });
}
function buildConn(){
  const box=$('cnb');
  const names=['cnNone','cnDash','cnPlus','cnBar'];
  const icons=['','<rect x="2" y="7.2" width="12" height="1.6"/>','<rect x="7" y="2" width="2" height="12"/><rect x="2" y="7" width="12" height="2"/>','<rect x="7.2" y="2" width="1.6" height="12"/>'];
  names.forEach((n,j)=>{
    const b=document.createElement('button');b.type='button';b.className='cb';b.setAttribute('role','radio');
    b.innerHTML=`<svg viewBox="0 0 16 16" aria-hidden="true">${icons[j]}</svg><span data-i="${n}"></span>`;
    b.onclick=()=>{st.cn=j;render()};box.appendChild(b);
  });
  $('gap').addEventListener('input',e=>{st.gap=+e.target.value;render()});
}
function relang(){applyLang();render()}

/* 내보내기 */
let tt;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200)}
async function saveFile(name,blob){
  try{
    const dl=window.claude&&await claude.use('downloads');
    if(dl){await dl.save({filename:name,data:blob});toast(t('tSaved',name));return}
  }catch(e){if(e&&e.code==='declined')return;if(e&&e.code&&e.code!=='unavailable'&&e.code!=='not_granted'){toast(t('tFail',e.code));return}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);toast(t('tSaved',name));
}
function fname(side){const n=(($('en').value.trim()||$('ko').value.trim())||'namecard').replace(/[^\p{L}\p{N}_-]+/gu,'_');return `NFUD_namecard_${n}_${side}`}
function exSvg(side){
  const D=data(),ex=`width="90mm" height="50mm"`;
  const s=side==='front'?svgFront(st.f,ex):svgBack(st.b,D,null,ex);
  saveFile(fname(side)+'.svg',new Blob(['<?xml version="1.0" encoding="UTF-8"?>\n'+s],{type:'image/svg+xml'}));
}
async function exPdf(){
  if(!window.jspdf){toast(t('tLib'));return}
  const btn=$('exPdf');btn.disabled=true;
  try{
    const D=data();
    const doc=new jspdf.jsPDF({unit:'mm',format:[90,50],orientation:'landscape',compress:true});
    const host=document.createElement('div');host.style.cssText='position:fixed;left:-9999px;top:0';document.body.appendChild(host);
    for(const [k,side] of [[0,'f'],[1,'b']]){
      host.innerHTML=side==='f'?svgFront(st.f,`width="${W}" height="${H}"`):svgBack(st.b,D,null,`width="${W}" height="${H}"`);
      if(k)doc.addPage([90,50],'landscape');
      await doc.svg(host.firstElementChild,{x:0,y:0,width:90,height:50});
    }
    host.remove();
    await saveFile(fname('card')+'.pdf',doc.output('blob'));
  }catch(e){console.error(e);toast(t('tPdf',e.message||e))}
  finally{btn.disabled=false;render()}
}

/* 초기화 */
function setData(o){customT=false;IDS.forEach(i=>$(i).value=o[i]||'')}
function init(){
  let saved=null;try{saved=JSON.parse(localStorage.getItem('namecard-v3')||'null')}catch(e){}
  setData(saved&&saved.D?saved.D:SAMPLE);
  if(saved&&saved.st){
    ['f','b'].forEach(k=>{
      const s=saved.st[k]||{},v=Math.min(Math.max(s.v|0,1),3),V=VERS[v-1];
      st[k].v=v;st[k].i=Math.min(Math.max(s.i|0,0),V[k].length-1);
      st[k].a=V.acc.includes(s.a)?s.a:V.acc[0];
      st[k].pa=(typeof s.pa==='string'&&V.acc.includes(s.pa))?s.pa:null;
    });
    OVK.forEach(k=>{const c=saved.st.ov&&saved.st.ov[k];st.ov[k]=(typeof c==='string'&&NAMES[c])?c:null});
    st.cn=Math.min(Math.max(saved.st.cn|0,0),3);const g=+saved.st.gap;if(g>=13&&g<=20)st.gap=g;
  }
  try{const l=localStorage.getItem('namecard-lang');LANG=l||((navigator.language||'ko').startsWith('ko')?'ko':'en')}catch(e){}
  try{F.R=opentype.parse(b64buf(FONT_B64.R));F.B=opentype.parse(b64buf(FONT_B64.B));F.K=opentype.parse(b64buf(FONT_B64.K))}catch(e){console.error(e)}
  buildPicks();buildOv();buildTitles();buildConn();applyLang();render();
  $('lko').onclick=()=>{LANG='ko';relang()};$('len').onclick=()=>{LANG='en';relang()};
  IDS.forEach(i=>$(i).addEventListener('input',render));
  $('clear').onclick=()=>{setData({});render();$('ko').focus()};
  $('sample').onclick=()=>{setData(SAMPLE);render()};
  $('exPdf').onclick=exPdf;$('exSvgF').onclick=()=>exSvg('front');$('exSvgB').onclick=()=>exSvg('back');
}
init();
</script>
